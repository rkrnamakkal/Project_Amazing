# This is a Declarative Automation Bundle definition for Project_Amazing_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Project_Amazing_Bundle
  uuid: 791e52a5-d904-4e14-9f20-24b47aa90408

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619006621199.19.azuredatabricks.net
    variables:
      catalog: mission100ramakrishnan18021986hybrid
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405619006621199.19.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/rkrnamakkal@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rkrnamakkal@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mission100ramakrishnan18021986hybrid
      schema: prod
    permissions:
      - user_name: rkrnamakkal@gmail.com
        level: CAN_MANAGE
