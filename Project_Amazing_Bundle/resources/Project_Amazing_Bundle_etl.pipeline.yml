# The main pipeline for Project_Amazing_Bundle

resources:
  pipelines:
    Project_Amazing_Bundle_etl:
      name: Project_Amazing_Bundle_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Project_Amazing_Bundle_etl"

      libraries:
        - glob:
            include: ../src/Project_Amazing_Bundle_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
